name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7.3.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv venv && uv pip install ".[dev,browser]"

      - name: Lint
        run: uv run ruff check wafer/ tests/

      - name: Test
        run: uv run pytest tests/ -x -q

      # [build-system] leaves hatchling unpinned, so every build resolves the
      # newest one, while the publisher validates with a twine frozen at a SHA.
      # When hatchling bumps its default core-metadata version past what that
      # twine accepts, the release aborts after the tag already exists (v0.5.0
      # hit exactly this: metadata 2.5 vs the twine 6.1.0 in publish action
      # v1.13.0). Running the publisher's own twine here turns that into a red
      # CI run on an ordinary push instead.
      #
      # The pin must track the gh-action-pypi-publish SHA in publish.yml. An
      # unpinned twine would float alongside hatchling and accept metadata the
      # publisher still rejects, which is a check that can never fail.
      - name: Validate distribution metadata
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
